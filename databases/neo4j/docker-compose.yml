# Run from repo root: docker compose -f databases/neo4j/docker-compose.yml --env-file .env up -d
services:
  neo4j:
    image: neo4j:5-community
    container_name: bench-neo4j
    # No env_file: the image turns every NEO4J_* variable into a config setting, and
    # strict validation rejects unknown ones such as NEO4J_USER.
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_me_neo4j}
      # Heap + page cache stay well below DB_MEMORY to leave room for the JVM and OS.
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 2G
      # Used by neo4j-admin import, which runs in a separate JVM.
      HEAP_SIZE: 2G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - ../../data:/import:ro
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-2}"
          memory: ${DB_MEMORY:-4g}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  neo4j_data:
